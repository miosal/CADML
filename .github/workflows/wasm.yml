# CI: build CADML to WebAssembly and run the end-to-end node test.
#
# Mirrors the local recipe in src/wasm/README.md (emsdk 5.0.7 + ninja), on a
# Linux runner where emcc/emcmake land on PATH automatically.

name: wasm

# Run on every push and pull request (no path filters) plus on every
# published release.
on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The software version has one source of truth: project(VERSION …)
      # in CMakeLists.txt (README, the web footer, and the vendored
      # artifact stamps all derive from it). Two guards:
      #  - every run: the checked-in generated web version file and the
      #    vendored wasm artifact names must match the project version —
      #    catching a version bump that forgot `pnpm wasm:refresh` at the
      #    PR that introduces it, not at release time;
      #  - releases only: the git tag must match too. A release that
      #    disagrees is mislabelled — fail instead of shipping it.
      - name: Verify version stamps match project version
        run: |
          ver=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          mm=${ver%.*}
          fail=0
          if ! grep -q "CADML_VERSION = '$mm'" web/lib/cadml-version.ts; then
            echo "::error::web/lib/cadml-version.ts CADML_VERSION != $mm — run pnpm wasm:refresh"
            fail=1
          fi
          if ! grep -q "CADML_SOFTWARE_VERSION = '$ver'" web/lib/cadml-version.ts; then
            echo "::error::web/lib/cadml-version.ts CADML_SOFTWARE_VERSION != $ver — run pnpm wasm:refresh"
            fail=1
          fi
          for f in web/public/wasm/cadml-$mm.js web/public/wasm/cadml-$mm.wasm; do
            if [ ! -f "$f" ]; then
              echo "::error::missing vendored artifact $f for project version $ver — run pnpm wasm:refresh"
              fail=1
            fi
          done
          exit $fail

      - name: Verify release tag matches project version
        if: github.event_name == 'release'
        run: |
          ver=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::release tag $GITHUB_REF_NAME != project version v$ver (CMakeLists.txt)"
            exit 1
          fi

      - name: Set up Node (to run the wasm module)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '5.0.7'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (FetchContent pulls all deps)
        run: cmake --preset wasm

      - name: Build cadml.wasm
        run: cmake --build build/wasm

      - name: Report artifact size
        run: ls -l build/wasm/cadml.js build/wasm/cadml.wasm

      # Publish the built module so it can be vendored into web/public/wasm
      # without a local emscripten toolchain (download with `gh run download`).
      - name: Upload wasm artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadml-wasm
          path: |
            build/wasm/cadml.js
            build/wasm/cadml.wasm
          if-no-files-found: error

      - name: End-to-end test
        working-directory: src/wasm
        run: node test_cadml_wasm.cjs
